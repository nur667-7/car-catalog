spring.application.name=car-catalog
server.port=8080

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# Database Configuration (File-backed relational SQL database)
spring.datasource.url=jdbc:h2:file:./data/car_catalog;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate DDL auto creation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console for inspecting tables
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
